<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1f2328; --muted: #8b949e;
    --border: #e1e4e8; --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #7d8590;
      --border: #30363d; --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  main {
    max-width: 480px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: inherit;
  }
  button.add {
    padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--border);
  }
  li input { width: 18px; height: 18px; accent-color: var(--accent); }
  li span { flex: 1; word-break: break-word; cursor: text; }
  li input.edit {
    flex: 1; min-width: 0; width: auto; height: auto; padding: 4px 8px;
    font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--accent); border-radius: 6px;
  }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li button {
    border: 0; background: none; color: var(--muted);
    font-size: 1.2rem; cursor: pointer; padding: 0 4px;
  }
  li button:hover { color: #e5534b; }
  #count { margin: 12px 0 0; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>할 일 목록</h1>
  <form id="form">
    <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
    <button class="add" type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <p id="count"></p>
</main>
<script>
  const KEY = 'todos';
  let todos = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
  }

  function render() {
    const list = document.getElementById('list');
    list.replaceChildren();
    for (const todo of todos) {
      const li = document.createElement('li');
      li.className = todo.done ? 'done' : '';

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = todo.done;
      check.addEventListener('change', () => { todo.done = check.checked; update(); });

      const text = document.createElement('span');
      text.textContent = todo.text;
      text.title = '더블클릭해서 수정';
      text.addEventListener('dblclick', () => startEdit(text, todo));

      const del = document.createElement('button');
      del.textContent = '×';
      del.title = '삭제';
      del.addEventListener('click', () => { todos = todos.filter(t => t !== todo); update(); });

      li.append(check, text, del);
      list.append(li);
    }
    const left = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent =
      todos.length ? `남은 할 일 ${left}개 / 전체 ${todos.length}개` : '할 일이 없어요.';
  }

  function startEdit(text, todo) {
    const edit = document.createElement('input');
    edit.type = 'text';
    edit.className = 'edit';
    edit.value = todo.text;
    let finished = false;
    const finish = keep => {
      if (finished) return;
      finished = true;
      const value = edit.value.trim();
      if (keep && value) todo.text = value;
      update();
    };
    edit.addEventListener('keydown', e => {
      if (e.isComposing) return; // 한글 조합 중 Enter는 무시
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    edit.addEventListener('blur', () => finish(true));
    text.replaceWith(edit);
    edit.focus();
    edit.select();
  }

  function update() { save(); render(); }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = '';
    update();
  });

  render();
</script>
</body>
</html>
