# R2 업로드 연결 테스트: 샘플 사진 1장을 올리고 공개 URL로 다시 받아지는지 확인
# 이 파일을 고쳐 push하거나 Actions 탭에서 직접 실행 (Run workflow)
name: R2 업로드 테스트

on:
  workflow_dispatch:
  push:
    branches: [claude/bold-sagan-3xxoc8]
    paths: [.github/workflows/r2-upload-test.yml, cardnews/upload-r2.js]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: R2에 올리기
        id: up
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          url=$(node cardnews/upload-r2.js cardnews/samples/images/pixabay-7520535.jpg test/upload-check.jpg)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 공개 URL로 받아지는지 확인
        run: |
          code=$(curl -s -o /tmp/check.jpg -w '%{http_code}' "${{ steps.up.outputs.url }}")
          echo "HTTP $code"
          test "$code" = 200
          file /tmp/check.jpg
          cmp /tmp/check.jpg cardnews/samples/images/pixabay-7520535.jpg && echo "원본과 같은 파일"
